[plugin]
id = "opencad.construction"
name = "Construction Layers & Guides"
version = "0.3.0"
description = "Construction layers, infinite lines, rays, and reference guides inspired by LibreCAD & FreeCAD."
author = "AAD001-Dwg & Open CAD Studio Community"
license = "GPL-3.0-only"
repository = "https://github.com/AAD001-Dwg/OpenCadStudio-construction-layer-plugin"

[opencad]
api_version = 14
ribbon_order = 55
command_prefixes = ["CONST_", "CLINE", "CRAY", "CCIRCLE", "CLAYER", "CAPACONST", "CAPAC", "CL", "CH", "CV", "CR", "CC", "CY", "CT"]
xdata_apps = ["OPENCAD_CONSTRUCTION"]
